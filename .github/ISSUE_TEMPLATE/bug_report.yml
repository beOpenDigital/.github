name: Relato de bug
description: Reportar um erro ou comportamento inesperado em um projeto da OpenDigital.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar este problema. **Não inclua senhas, tokens, chaves privadas ou dados pessoais reais** neste formulário.
        Para questões de segurança, siga a [Política de Segurança](https://github.com/beOpenDigital/.github/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Resumo do problema
      description: Descreva de forma objetiva o que aconteceu.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Passos mínimos para reproduzir o comportamento.
      placeholder: |
        1. Acesse...
        2. Execute...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado vs. observado
      description: O que deveria acontecer e o que aconteceu na prática.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Ambiente e evidências
      description: Versão, sistema operacional, navegador ou logs relevantes (sem dados sensíveis).
    validations:
      required: false
