name: CI Node.js

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
